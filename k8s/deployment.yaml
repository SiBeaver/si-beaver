apiVersion: apps/v1
kind: Deployment
metadata:
  name: si-beaver-cloud
  namespace: sibs
  labels:
    app: si-beaver-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: si-beaver-cloud
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: si-beaver-cloud
    spec:
      containers:
        - name: si-beaver-cloud
          image: 10.1.1.40:5000/si-beaver-cloud:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7420
          env:
            # --- Beaver ---
            - name: SI_BEAVER_HOME
              value: /data
            - name: SI_BEAVER_PORT
              value: "7420"
            - name: SI_BEAVER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: si-beaver-secret
                  key: auth-token
            # --- Cloud ---
            - name: PORT
              value: "7420"
            - name: DATA_DIR
              value: /data
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: si-beaver-cloud-secret
                  key: auth-token
            - name: SIBS_PROJECT
              valueFrom:
                secretKeyRef:
                  name: si-beaver-cloud-secret
                  key: sibs-project
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: si-beaver-cloud-secret
                  key: llm-api-key
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: si-beaver-cloud-secret
                  key: llm-base-url
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: si-beaver-cloud-secret
                  key: llm-model
                  optional: true
            # --- Database ---
            - name: DATABASE_URL
              value: postgres://sibeaver:sibeaver@10.1.1.40:5432/sibeaver
          volumeMounts:
            - name: app-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7420
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 7420
            initialDelaySeconds: 8
            periodSeconds: 10
            failureThreshold: 8
      volumes:
        - name: app-data
          hostPath:
            path: /opt/sibs-data
            type: DirectoryOrCreate
